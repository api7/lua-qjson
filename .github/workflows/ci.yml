name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build (release)
        run: cargo build --release

      - name: Test (release)
        run: cargo test --release

      - name: Test scalar-only (no AVX2/NEON feature)
        run: cargo test --release --no-default-features

      - name: Test debug scalar-only
        run: cargo test --no-default-features

      - name: Test with test-panic feature
        run: cargo test --features test-panic --release

  lua-lint:
    name: Lua lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1.0-beta3"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4
        with:
          luarocksVersion: "3.11.1"

      - name: Install luacheck
        run: |
          luarocks install https://luarocks.org/argparse-0.7.2-1.src.rock
          luarocks install https://luarocks.org/luafilesystem-1.9.0-1.src.rock
          luarocks install https://luarocks.org/luacheck-1.2.0-1.src.rock

      - name: Run Lua lint
        run: make lua-lint

  fuzz:
    name: Fuzz regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (nightly)
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update

      - name: Cache cargo registry & fuzz target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'fuzz/Cargo.toml') }}
          restore-keys: |
            fuzz-${{ runner.os }}-${{ runner.arch }}-

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install --locked cargo-fuzz
          fi

      - name: Run fuzz targets
        run: |
          cargo +nightly fuzz run fuzz_parse_eager -- -max_total_time=60
          cargo +nightly fuzz run fuzz_depth -- -max_total_time=60
          cargo +nightly fuzz run fuzz_ffi_ops -- -max_total_time=60

      - name: Run lazy parse fuzz target
        run: cargo +nightly fuzz run fuzz_parse_lazy -- -max_total_time=60

  sanitizers:
    name: Sanitizers (Rust nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (nightly)
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup +nightly target add x86_64-unknown-linux-gnu
          rustup +nightly component add miri

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sanitizers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            sanitizers-${{ runner.os }}-${{ runner.arch }}-

      - name: Miri FFI tests (scalar scanner)
        run: |
          cargo +nightly miri test --target x86_64-unknown-linux-gnu --no-default-features --test ffi_smoke
          cargo +nightly miri test --target x86_64-unknown-linux-gnu --no-default-features --test ffi_cursor
          cargo +nightly miri test --target x86_64-unknown-linux-gnu --no-default-features --test ffi_strings
          cargo +nightly miri test --target x86_64-unknown-linux-gnu --no-default-features --test ffi_ops_interleave

      - name: ASan FFI smoke tests
        continue-on-error: true
        env:
          RUSTFLAGS: -Z sanitizer=address
        run: |
          cargo +nightly test --release --target x86_64-unknown-linux-gnu --test ffi_smoke
          cargo +nightly test --release --target x86_64-unknown-linux-gnu --test ffi_strings
          cargo +nightly test --release --target x86_64-unknown-linux-gnu --test ffi_ops_interleave

  lua:
    name: Lua integration tests (${{ matrix.runtime.name }})
    runs-on: ubuntu-latest
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - name: upstream LuaJIT
            lua_version: "luajit-2.1.0-beta3"
            validate_rockspec: true
            valgrind: true
          - name: OpenResty LuaJIT
            lua_version: "luajit-openresty"
            validate_rockspec: false
            valgrind: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install LuaJIT (${{ matrix.runtime.name }})
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.runtime.lua_version }}

      - name: Install LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks

      - name: Install valgrind
        if: matrix.runtime.valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build cdylib
        run: cargo build --release

      - name: Install Lua dependencies
        run: |
          # Ubuntu LuaRocks targets Lua 5.1 by default; LuaJIT is ABI-compatible
          # with 5.1 so rocks built for 5.1 load fine under each matrix runtime.
          sudo luarocks install busted
          sudo luarocks install lua-cjson

      - name: Resolve LuaJIT executable
        id: luajit
        run: |
          set -euo pipefail
          for candidate in luajit luajit-2.1.0-beta3 lua; do
            if command -v "$candidate" >/dev/null 2>&1; then
              lua_bin="$(command -v "$candidate")"
              if "$lua_bin" -e 'assert(jit, "LuaJIT required")' >/dev/null 2>&1; then
                echo "path=$lua_bin" >> "$GITHUB_OUTPUT"
                "$lua_bin" -e 'print(jit.version)'
                exit 0
              fi
            fi
          done
          echo "LuaJIT executable not found" >&2
          exit 1

      - name: Run busted tests (${{ matrix.runtime.name }})
        env:
          LUAJIT_BIN: ${{ steps.luajit.outputs.path }}
        run: |
          # ffi.load("qjson") uses dlopen which respects LD_LIBRARY_PATH,
          # not LuaJIT's package.cpath. Point dlopen at the release build dir.
          LD_LIBRARY_PATH="$PWD/target/release" \
            busted --lua="$LUAJIT_BIN" tests/lua \
              --lpath='./lua/?.lua'

      - name: Run busted tests under valgrind (upstream LuaJIT)
        if: matrix.runtime.valgrind
        continue-on-error: true
        env:
          LUAJIT_BIN: ${{ steps.luajit.outputs.path }}
          LUA_INIT: if jit then jit.off() end
        run: |
          # Valgrind is a supplemental end-to-end canary for the real LuaJIT
          # FFI path. Disable JIT compilation so Memcheck observes the
          # interpreter + FFI boundary instead of LuaJIT's generated traces.
          # Trace children so the LuaRocks busted launcher re-execs into the
          # selected LuaJIT binary under Memcheck.
          LD_LIBRARY_PATH="$PWD/target/release" \
            valgrind \
              --trace-children=yes \
              --error-exitcode=1 \
              --leak-check=full \
              --show-leak-kinds=definite,indirect,possible \
              --errors-for-leak-kinds=definite,indirect,possible \
              --num-callers=24 \
              --suppressions=valgrind.supp \
              busted --lua="$LUAJIT_BIN" tests/lua \
                --lpath='./lua/?.lua'

      - name: Validate LuaRocks package
        if: matrix.runtime.validate_rockspec
        env:
          LUAJIT_BIN: ${{ steps.luajit.outputs.path }}
        run: |
          rm -rf /tmp/lua-qjson-rock
          ROCKSPEC="$(python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"^lua-qjson-(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?-(\d+)\.rockspec$")
          def prerelease_key(value):
              if value is None:
                  return ()
              key = []
              for part in value.split("."):
                  if part.isdigit():
                      key.append((0, int(part)))
                  else:
                      key.append((1, part))
              return tuple(key)

          matches = []
          for path in Path("rockspec").glob("lua-qjson-*.rockspec"):
              match = pattern.match(path.name)
              if match:
                  major, minor, patch, prerelease, revision = match.groups()
                  matches.append((int(major), int(minor), int(patch), prerelease is None, prerelease_key(prerelease), int(revision), str(path)))
          if not matches:
              raise SystemExit("no lua-qjson rockspec found")
          print(max(matches)[-1])
          PY
          )"
          luarocks make "$ROCKSPEC" --tree /tmp/lua-qjson-rock
          eval "$(luarocks path --tree /tmp/lua-qjson-rock)"
          unset LD_LIBRARY_PATH
          "$LUAJIT_BIN" -e 'local qjson = require("qjson"); local doc = qjson.parse("{\"a\":42}"); assert(doc:get_i64("a") == 42)'
          busted --lua="$LUAJIT_BIN" tests/lua

  package:
    name: LuaRocks package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1.0-beta3"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4
        with:
          luarocksVersion: "3.11.1"

      - name: Validate LuaRocks package
        run: |
          rm -rf /tmp/lua-qjson-rock
          ROCKSPEC="$(python3 - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"^lua-qjson-(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?-(\d+)\.rockspec$")
          def prerelease_key(value):
              if value is None:
                  return ()
              key = []
              for part in value.split("."):
                  if part.isdigit():
                      key.append((0, int(part)))
                  else:
                      key.append((1, part))
              return tuple(key)

          matches = []
          for path in Path("rockspec").glob("lua-qjson-*.rockspec"):
              match = pattern.match(path.name)
              if match:
                  major, minor, patch, prerelease, revision = match.groups()
                  matches.append((int(major), int(minor), int(patch), prerelease is None, prerelease_key(prerelease), int(revision), str(path)))
          if not matches:
              raise SystemExit("no lua-qjson rockspec found")
          print(max(matches)[-1])
          PY
          )"
          luarocks make "$ROCKSPEC" --tree /tmp/lua-qjson-rock
          eval "$(luarocks path --tree /tmp/lua-qjson-rock)"
          unset LD_LIBRARY_PATH
          unset DYLD_LIBRARY_PATH
          lua -e 'assert(jit, "LuaJIT required"); local qjson = require("qjson"); local doc = qjson.parse("{\"a\":42}"); assert(doc:get_i64("a") == 42)'
