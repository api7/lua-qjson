name: Release

on:
  push:
    branches:
      - "main"
    paths:
      - "rockspec/**"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4
        with:
          luarocksVersion: "3.11.1"

      - name: Install upload dependency
        run: luarocks install dkjson

      - name: Extract release name
        id: release_env
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          re="^feat: release v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$"
          if [[ $title =~ $re ]]; then
              v=v${BASH_REMATCH[1]}
              echo "version=${v}" >> $GITHUB_OUTPUT
              echo "version_without_v=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
              if [[ ${BASH_REMATCH[1]} == *-* ]]; then
                  echo "is_prerelease=true" >> $GITHUB_OUTPUT
              else
                  echo "is_prerelease=false" >> $GITHUB_OUTPUT
              fi
          else
              echo "commit format is not correct (expected: feat: release vX.Y.Z[-prerelease])"
              exit 1
          fi

      - name: Verify rockspec exists
        id: verify_rockspec
        shell: bash
        run: |
          rockspec_file="rockspec/lua-qjson-${{ steps.release_env.outputs.version_without_v }}-1.rockspec"
          if [ ! -f "$rockspec_file" ]; then
              echo "rockspec file not found: $rockspec_file"
              exit 1
          fi
          echo "rockspec_file=${rockspec_file}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_env.outputs.version }}
          name: ${{ steps.release_env.outputs.version }}
          draft: false
          prerelease: ${{ steps.release_env.outputs.is_prerelease }}

      - name: Upload to LuaRocks
        env:
          LUAROCKS_TOKEN: ${{ secrets.LUAROCKS_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$HOME/.luarocks"
          chmod 700 "$HOME/.luarocks"
          lua -e 'local token = assert(os.getenv("LUAROCKS_TOKEN"), "missing LUAROCKS_TOKEN"); local f = assert(io.open(os.getenv("HOME") .. "/.luarocks/upload_config.lua", "w")); f:write(("key = %q\n"):format(token)); f:write("server = \"https://luarocks.org\"\nversion = \"1.0\"\n"); f:close()'
          chmod 600 "$HOME/.luarocks/upload_config.lua"
          luarocks upload "${{ steps.verify_rockspec.outputs.rockspec_file }}"
