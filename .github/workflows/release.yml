name: Release

on:
  push:
    branches:
      - "main"
    paths:
      - "rockspec/**"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v4
        with:
          luarocksVersion: "3.11.1"

      - name: Extract release name
        id: release_env
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title="$HEAD_COMMIT_MESSAGE"
          re="^feat: release v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$"
          if [[ $title =~ $re ]]; then
              v=v${BASH_REMATCH[1]}
              echo "version=${v}" >> $GITHUB_OUTPUT
              echo "version_without_v=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
              echo "commit format is not correct (expected: feat: release vX.Y.Z[-prerelease])"
              exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_env.outputs.version }}
          name: ${{ steps.release_env.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload to LuaRocks
        env:
          LUAROCKS_TOKEN: ${{ secrets.LUAROCKS_TOKEN }}
        run: |
          luarocks install dkjson
          luarocks upload rockspec/lua-qjson-${{ steps.release_env.outputs.version_without_v }}-1.rockspec --api-key=${LUAROCKS_TOKEN}
