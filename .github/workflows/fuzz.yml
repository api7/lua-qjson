name: Timed Fuzzing

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds per fuzz target (default: 60)"
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Timed fuzzing
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (nightly)
        run: rustup toolchain install nightly --profile minimal --no-self-update

      - name: Cache cargo registry & fuzz target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: timed-fuzz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            timed-fuzz-${{ runner.os }}-${{ runner.arch }}-

      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo install --locked cargo-fuzz
          fi

      - name: Run timed fuzz targets
        env:
          DISPATCH_MAX_TOTAL_TIME: ${{ github.event.inputs.max_total_time }}
        run: |
          set -euo pipefail
          max_total_time="${DISPATCH_MAX_TOTAL_TIME:-}"
          if [ -z "$max_total_time" ]; then
              max_total_time=60
          fi
          if ! [[ "$max_total_time" =~ ^[1-9][0-9]*$ ]]; then
              echo "max_total_time must be a positive integer, got '$max_total_time'" >&2
              exit 1
          fi

          cargo +nightly fuzz run fuzz_parse_eager -- -max_total_time="$max_total_time"
          cargo +nightly fuzz run fuzz_depth -- -max_total_time="$max_total_time"
          cargo +nightly fuzz run fuzz_ffi_ops -- -max_total_time="$max_total_time"
          cargo +nightly fuzz run fuzz_numbers -- -max_total_time="$max_total_time"
          cargo +nightly fuzz run fuzz_parse_lazy -- -max_total_time="$max_total_time"
