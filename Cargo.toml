[package]
name = "lua-quick-decode"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "quickdecode"
crate-type = ["cdylib", "rlib"]

[dependencies]
memchr = "2"
rustc-hash = "2"
once_cell = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
