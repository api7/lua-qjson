[package]
name = "qjson"
version = "0.1.0"
edition = "2021"
description = "Fast JSON decoder for LuaJIT FFI consumers"
license = "Apache-2.0"
repository = "https://github.com/api7/lua-qjson"
homepage = "https://github.com/api7/lua-qjson"

[lib]
name = "qjson"
crate-type = ["cdylib", "rlib"]

[features]
default    = ["avx2"]
avx2       = []
test-panic = []

[dependencies]
memchr = "2"
rustc-hash = "2"
once_cell = "1"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "rust_bench"
harness = false
