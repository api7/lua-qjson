[package]
name = "qjson-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.qjson]
path = ".."

[[bin]]
name = "fuzz_parse_eager"
path = "fuzz_targets/fuzz_parse_eager.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_depth"
path = "fuzz_targets/fuzz_depth.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ffi_ops"
path = "fuzz_targets/fuzz_ffi_ops.rs"
test = false
doc = false
bench = false
